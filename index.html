<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gara (愛)</title>

  <!-- Support PWA iOS & Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gara">

  <!-- React, ReactDOM, Styled-Components & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/styled-components@5.3.11/dist/styled-components.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #E6E6E6;
      font-family: 'Shippori Mincho', serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const styled = window.styled;

    // --- STYLED COMPONENTS ---

    const AppContainer = styled.div`
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: ${props => props.isAngry ? '#8B0000' : '#E6E6E6'};
      transition: background 0.3s ease;
      padding: 24px;
    `;

    const GridContainer = styled.div`
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      max-width: 100%;
      max-height: 80vh;
      overflow: hidden;
    `;

    const KanjiWrapper = styled.div`
      position: relative;
      width: ${props => props.size}px;
      height: ${props => props.size}px;
      cursor: pointer;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.08));
      transition: transform 0.2s ease;

      &:active {
        transform: scale(0.96);
      }
    `;

    const BloodFill = styled.div`
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: ${props => props.fillLevel}%;
      background-color: #8B0000;
      transition: height 1s cubic-bezier(0.16, 1, 0.3, 1);
    `;

    const SVGMask = styled.svg`
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    `;

    const ModalOverlay = styled.div`
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(230, 230, 230, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 32px;
    `;

    const DialogueText = styled.p`
      font-size: 13px;
      letter-spacing: 2px;
      color: ${props => props.angry ? '#FFFFFF' : '#1A1A1A'};
      margin-bottom: 24px;
      text-align: center;
      max-width: 300px;
      line-height: 1.6;
    `;

    const ButtonGroup = styled.div`
      display: flex;
      gap: 12px;
    `;

    const FlatButton = styled.button`
      background: #D9D9D9;
      border: 1px solid #B3B3B3;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1px;
      color: #1A1A1A;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.04);

      &:active {
        background: #CCCCCC;
        transform: translateY(1px);
      }
    `;

    const InputField = styled.textarea`
      width: 100%;
      max-width: 300px;
      height: 80px;
      background: #F0F0F0;
      border: 1px solid #B3B3B3;
      padding: 12px;
      font-family: inherit;
      font-size: 12px;
      color: #1A1A1A;
      outline: none;
      resize: none;
      margin-bottom: 12px;
    `;

    const WarningText = styled.span`
      font-size: 10px;
      color: #8B0000;
      letter-spacing: 1px;
      margin-bottom: 12px;
    `;

    const TutorialBox = styled.div`
      border: 1px solid #1A1A1A;
      padding: 24px;
      max-width: 320px;
      text-align: center;
      background: #F0F0F0;
    `;

    // --- APPLICATION PRINCIPALE ---

    function GaraApp() {
      const [isStandalone, setIsStandalone] = useState(false);
      const [wishes, setWishes] = useState([]); // Tableau des vœux actifs
      const [step, setStep] = useState('IDLE');
      const [wishInput, setWishInput] = useState('');
      const [memoryInput, setMemoryInput] = useState('');
      const [warning, setWarning] = useState('');
      const [isAngry, setIsAngry] = useState(false);
      const [maxAllowedKanjis, setMaxAllowedKanjis] = useState(1);

      // 1. Détection PWA (Mode Installé)
      useEffect(() => {
        const checkStandalone = () => {
          const isIOSStandalone = window.navigator.standalone === true;
          const isDisplayStandalone = window.matchMedia('(display-mode: standalone)').matches;
          setIsStandalone(isIOSStandalone || isDisplayStandalone);
        };

        checkStandalone();
        window.addEventListener('resize', checkStandalone);

        // Calcul de la capacité de l'écran (Screen Real Estate)
        const calculateCapacity = () => {
          const h = window.innerHeight;
          const w = window.innerWidth;
          if (h < 600 || w < 360) setMaxAllowedKanjis(1); // Petit écran / Vieux mobile
          else if (h < 800) setMaxAllowedKanjis(2);
          else setMaxAllowedKanjis(4);
        };

        calculateCapacity();
        window.addEventListener('resize', calculateCapacity);
      }, []);

      // 2. Traitement du Refus
      const handleRefuse = () => {
        document.body.innerHTML = `
          <div style='background:#E6E6E6;height:100vh;display:flex;justify-content:center;align-items:center;font-family:serif;font-size:11px;letter-spacing:3px;color:#8B0000;'>
            [ ACCÈS REFUSÉ — SYSTEM DETACHED ]
          </div>`;
      };

      // 3. Traitement du Vœu
      const handleSubmitWish = () => {
        if (wishInput.trim().length < 3) {
          setWarning("L'intention est trop faible.");
          return;
        }
        setWarning('');
        setStep('ENTER_MEMORY');
      };

      // 4. Traitement du Souvenir (Anti-fraude & Colère)
      const handleSubmitMemory = () => {
        const cleanMemory = memoryInput.trim().toLowerCase();
        const savedMemories = JSON.parse(localStorage.getItem('gara_memories') || '[]');

        if (savedMemories.includes(cleanMemory)) {
          // Trigger l'état COLÈRE
          setIsAngry(true);
          setStep('ANGRY_STATE');
          setTimeout(() => {
            setIsAngry(false);
            setStep('IDLE');
            setMemoryInput('');
            setWishInput('');
          }, 3000);
          return;
        }

        // Sauvegarde du souvenir
        savedMemories.push(cleanMemory);
        localStorage.setItem('gara_memories', JSON.stringify(savedMemories));

        // Calcul du score sémantique
        let weight = Math.min(100, memoryInput.length * 2 + wishInput.length * 2);

        const newWishObj = {
          id: Date.now(),
          text: wishInput,
          fill: weight
        };

        setWishes([...wishes, newWishObj]);
        setWishInput('');
        setMemoryInput('');
        setStep('IDLE');
      };

      // Clic sur le bouton central quand vide
      const handleMainClick = () => {
        if (wishes.length >= maxAllowedKanjis) {
          alert("L'espace écran est saturé. Supprimez un vœu pour libérer le réceptacle.");
          return;
        }
        setStep('PROMPT_WISH');
      };

      // Si l'application N'EST PAS installée -> Affichage du Tutoriel
      if (!isStandalone) {
        return (
          <AppContainer>
            <TutorialBox>
              <DialogueText style={{marginBottom: '16px'}}>
                [ ACCÈS RESTREINT ]<br/><br/>
                Gara ne peut pas s'infiltrer depuis un navigateur standard.
              </DialogueText>
              <DialogueText style={{fontSize: '11px', color: '#666'}}>
                Pour sceller le pacte :<br/><br/>
                <b>iOS (Safari) :</b> Partager ➔ "Sur l'écran d'accueil"<br/>
                <b>Android (Chrome) :</b> Options ➔ "Installer l'application"
              </DialogueText>
            </TutorialBox>
          </AppContainer>
        );
      }

      // Si l'application EST installée -> Exécution de Gara
      return (
        <AppContainer isAngry={isAngry}>
          {/* Grille dynamique des Kanjis */}
          <GridContainer>
            {wishes.length === 0 ? (
              // Kanji initial vide
              <KanjiWrapper size={240} onClick={handleMainClick}>
                <BloodFill fillLevel={0} />
                <SVGMask viewBox="0 0 100 100">
                  <defs>
                    <mask id="kanji-mask-main">
                      <rect width="100" height="100" fill="white" />
                      <text x="50%" y="74%" font-size="72" font-family="serif" text-anchor="middle" fill="black" font-weight="bold">愛</text>
                    </mask>
                  </defs>
                  <rect width="100" height="100" fill="#E6E6E6" mask="url(#kanji-mask-main)" />
                  <text x="50%" y="74%" font-size="72" font-family="serif" text-anchor="middle" fill="none" stroke="#1A1A1A" stroke-width="0.4">愛</text>
                </SVGMask>
              </KanjiWrapper>
            ) : (
              wishes.map((w) => (
                <KanjiWrapper key={w.id} size={wishes.length > 1 ? 160 : 240}>
                  <BloodFill fillLevel={w.fill} />
                  <SVGMask viewBox="0 0 100 100">
                    <defs>
                      <mask id={`kanji-mask-${w.id}`}>
                        <rect width="100" height="100" fill="white" />
                        <text x="50%" y="74%" font-size="72" font-family="serif" text-anchor="middle" fill="black" font-weight="bold">愛</text>
                      </mask>
                    </defs>
                    <rect width="100" height="100" fill="#E6E6E6" mask={`url(#kanji-mask-${w.id})`} />
                    <text x="50%" y="74%" font-size="72" font-family="serif" text-anchor="middle" fill="none" stroke="#1A1A1A" stroke-width="0.4">愛</text>
                  </SVGMask>
