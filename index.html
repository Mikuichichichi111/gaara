<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gara (愛)</title>

  <!-- Support PWA iOS & Android -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gara">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #E6E6E6;
      font-family: 'Shippori Mincho', serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease;
    }

    /* Le Kanji central avec remplissage de sang en CSS pur (Zero SVG bug) */
    .kanji-display {
      font-size: 140px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      line-height: 1;
      /* Gradient initial : 0% de sang (#8B0000), le reste en noir/gris de contour (#1A1A1A) */
      background: linear-gradient(to top, #8B0000 0%, #1A1A1A 0%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 6px 12px rgba(0, 0, 0, 0.08));
      transition: background 1s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s ease;
    }

    .kanji-display:active {
      transform: scale(0.96);
    }

    /* Modales et dialogues */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(230, 230, 230, 0.96);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      padding: 32px;
    }

    .hidden {
      display: none !important;
    }

    .dialogue-text {
      font-size: 13px;
      letter-spacing: 2px;
      color: #1A1A1A;
      margin-bottom: 24px;
      text-align: center;
      max-width: 300px;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }

    .flat-btn {
      background: #D9D9D9;
      border: 1px solid #B3B3B3;
      padding: 10px 24px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1px;
      color: #1A1A1A;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.04);
    }

    .flat-btn:active {
      background: #CCCCCC;
      transform: translateY(1px);
    }

    .input-field {
      width: 100%;
      max-width: 300px;
      height: 80px;
      background: #F0F0F0;
      border: 1px solid #B3B3B3;
      padding: 12px;
      font-family: inherit;
      font-size: 12px;
      color: #1A1A1A;
      outline: none;
      resize: none;
      margin-bottom: 12px;
    }

    .warning-text {
      font-size: 10px;
      color: #8B0000;
      letter-spacing: 1px;
      margin-bottom: 12px;
      height: 14px;
    }
  </style>
</head>
<body>

  <!-- Le Kanji 愛 central géré par gradient CSS -->
  <div class="kanji-display" id="kanjiDisplay">愛</div>

  <!-- Étape 1 : Demande binaire -->
  <div class="modal-overlay hidden" id="modalPrompt">
    <p class="dialogue-text">Souhaitez-vous formuler un vœu ?</p>
    <div class="button-group">
      <button class="flat-btn" id="btnYes">OUI</button>
      <button class="flat-btn" id="btnNo">NON</button>
    </div>
  </div>

  <!-- Étape 2 : Saisie du vœu -->
  <div class="modal-overlay hidden" id="modalWish">
    <p class="dialogue-text">Formulez l'intention.</p>
    <textarea class="input-field" id="wishInput" placeholder="Écrivez ici..."></textarea>
    <div class="warning-text" id="wishWarning"></div>
    <button class="flat-btn" id="btnSubmitWish">SCELLER</button>
  </div>

  <!-- Étape 3 : Offrande du souvenir -->
  <div class="modal-overlay hidden" id="modalMemory">
    <p class="dialogue-text">Sacrifiez un souvenir pour alimenter ce vœu.</p>
    <textarea class="input-field" id="memoryInput" placeholder="Racontez un souvenir..."></textarea>
    <div class="warning-text" id="memoryWarning"></div>
    <button class="flat-btn" id="btnSubmitMemory">OFFRIR</button>
  </div>

  <!-- État de colère (Doublon) -->
  <div class="modal-overlay hidden" id="modalAngry" style="background: #8B0000;">
    <p class="dialogue-text" style="color: #FFFFFF;">
      [ ANOMALIE DÉTECTÉE ]<br><br>
      Ce souvenir a déjà été consumé.<br>
      Ne tentez pas de tromper Gara.
    </p>
  </div>

  <script>
    const kanjiDisplay = document.getElementById('kanjiDisplay');
    
    const modalPrompt = document.getElementById('modalPrompt');
    const modalWish = document.getElementById('modalWish');
    const modalMemory = document.getElementById('modalMemory');
    const modalAngry = document.getElementById('modalAngry');

    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    const btnSubmitWish = document.getElementById('btnSubmitWish');
    const btnSubmitMemory = document.getElementById('btnSubmitMemory');

    const wishInput = document.getElementById('wishInput');
    const memoryInput = document.getElementById('memoryInput');
    const wishWarning = document.getElementById('wishWarning');
    const memoryWarning = document.getElementById('memoryWarning');

    let currentWish = '';
    let isFilled = false;

    // Clic sur le Kanji pour démarrer
    kanjiDisplay.addEventListener('click', () => {
      if (!isFilled) {
        modalPrompt.classList.remove('hidden');
      }
    });

    // Refus -> Autodestruction visuelle
    btnNo.addEventListener('click', () => {
      document.body.innerHTML = `
        <div style='background:#E6E6E6;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center;font-family:serif;font-size:11px;letter-spacing:3px;color:#8B0000;'>
          [ PROTOCOLE ANNULÉ — SYSTÈME EFFACÉ ]
        </div>`;
    });

    // Acceptation
    btnYes.addEventListener('click', () => {
      modalPrompt.classList.add('hidden');
      modalWish.classList.remove('hidden');
    });

    // Validation du Vœu
    btnSubmitWish.addEventListener('click', () => {
      if (wishInput.value.trim().length < 3) {
        wishWarning.innerText = "L'intention est trop faible.";
        return;
      }
      currentWish = wishInput.value.trim();
      wishWarning.innerText = "";
      modalWish.classList.add('hidden');
      modalMemory.classList.remove('hidden');
    });

    // Validation du Souvenir & Remplissage du sang
    btnSubmitMemory.addEventListener('click', () => {
      const memoryText = memoryInput.value.trim().toLowerCase();
      if (memoryText.length < 5) {
        memoryWarning.innerText = "Ce souvenir n'a pas assez de poids.";
        return;
      }

      // Vérification anti-doublon dans le localStorage
      const savedMemories = JSON.parse(localStorage.getItem('gara_memories') || '[]');
      if (savedMemories.includes(memoryText)) {
        modalMemory.classList.add('hidden');
        modalAngry.classList.remove('hidden');
        setTimeout(() => {
          modalAngry.classList.add('hidden');
          memoryInput.value = '';
          wishInput.value = '';
        }, 3000);
        return;
      }

      // Enregistrer le souvenir
      savedMemories.push(memoryText);
      localStorage.setItem('gara_memories', JSON.stringify(savedMemories));

      // Calcul du score sémantique
      let score = Math.min(100, memoryText.length * 2 + currentWish.length * 2);
      const heavyWords = ['jamais', 'oublier', 'disparaître', 'regret', 'personne', 'pourquoi'];
      heavyWords.forEach(w => {
        if (memoryText.includes(w)) score += 20;
      });

      const fillPercent = Math.min(100, score);

      // Appliquer le gradient CSS pour faire monter le sang dans le kanji
      kanjiDisplay.style.background = `linear-gradient(to top, #8B0000 ${fillPercent}%, #1A1A1A ${fillPercent}%)`;
      isFilled = true;

      // Fermer les modales
      modalMemory.classList.add('hidden');
      memoryInput.value = '';
      wishInput.value = '';
    });
  </script>
</body>
</html>
